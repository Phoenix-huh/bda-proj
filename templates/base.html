<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="India Air Quality Dashboard — real-time predictions, multi-horizon forecasts, COVID-19 impact analysis, and interactive maps powered by machine learning.">
  <title>{% block title %}Air Quality Dashboard{% endblock %} | AQI India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens ─────────────────────────────────────────── */
    :root {
      --blue:      #3b82f6;
      --blue-dark: #1d4ed8;
      --blue-glow: rgba(59,130,246,.25);
      --accent:    #06b6d4;
      --green:     #10b981;
      --orange:    #f59e0b;
      --red:       #ef4444;
      --dark:      #0a0f1e;
      --dark2:     #111827;
      --dark3:     #1e2d40;
      --card:      rgba(255,255,255,.04);
      --card-border: rgba(255,255,255,.09);
      --text:      #e2e8f0;
      --text-muted:#94a3b8;
      --bg:        #0a0f1e;
      --radius:    14px;
      --shadow:    0 4px 24px rgba(0,0,0,.45);
    }

    /* ── Reset ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base ──────────────────────────────────────────────────── */
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Animated background mesh */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(59,130,246,.12) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(6,182,212,.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Navigation ────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10,15,30,.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 62px;
    }
    nav .brand {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #60a5fa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    nav .brand svg { flex-shrink: 0; }
    nav .nav-links { display: flex; align-items: center; gap: 4px; }
    nav .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: .88rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      transition: all .2s;
    }
    nav .nav-links a:hover, nav .nav-links a.active {
      color: var(--text);
      background: rgba(255,255,255,.08);
    }

    /* ── Main layout ─────────────────────────────────────────── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
    }

    /* ── Cards / Sections ─────────────────────────────────────── */
    section, .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 30px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #e2e8f0 30%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    p { color: var(--text-muted); }

    /* ── Forms / Controls ─────────────────────────────────────── */
    form, .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      align-items: end;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: .8rem;
      font-weight: 500;
      color: var(--text-muted);
      gap: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    select, input[type="date"], input[type="number"], input[type="text"] {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: .95rem;
      padding: 10px 12px;
      transition: border-color .2s, box-shadow .2s;
      appearance: none;
      -webkit-appearance: none;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-glow);
    }
    select option { background: #1e2d40; color: var(--text); }

    button {
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 600;
      padding: 11px 20px;
      cursor: pointer;
      transition: all .2s;
      box-shadow: 0 4px 14px rgba(59,130,246,.35);
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,.45); }
    button:active { transform: translateY(0); }
    button.secondary {
      background: rgba(255,255,255,.08);
      box-shadow: none;
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    button.secondary:hover { background: rgba(255,255,255,.14); box-shadow: none; }
    button:disabled { opacity: .5; cursor: wait; transform: none; box-shadow: none; }

    /* ── Alerts ───────────────────────────────────────────────── */
    .error {
      display: none;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.25);
      color: #fca5a5;
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: .9rem;
    }
    .warn {
      background: rgba(245,158,11,.1);
      border: 1px solid rgba(245,158,11,.2);
      color: #fcd34d;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: .9rem;
    }
    .warn code {
      background: rgba(255,255,255,.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: .85rem;
    }

    /* ── Tables ───────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; border-radius: 10px; margin-top: 16px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    th {
      background: rgba(255,255,255,.06);
      color: var(--text-muted);
      font-weight: 600;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 11px 14px;
      text-align: left;
      white-space: nowrap;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,.05);
      color: var(--text);
    }
    tbody tr:hover td { background: rgba(255,255,255,.03); }
    tr.best td {
      background: rgba(16,185,129,.08);
      color: #6ee7b7;
      font-weight: 600;
    }
    tr.best td:first-child {
      border-left: 3px solid var(--green);
    }

    /* ── Images ───────────────────────────────────────────────── */
    img.chart {
      width: 100%;
      max-width: 980px;
      display: block;
      margin: 20px auto;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    /* ── Misc ─────────────────────────────────────────────────── */
    .muted { color: var(--text-muted); font-size: .88rem; }
    code {
      background: rgba(255,255,255,.08);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: .85rem;
      color: #a5b4fc;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: .82rem;
      padding: 32px 20px;
      border-top: 1px solid var(--card-border);
      margin-top: 16px;
      position: relative;
      z-index: 1;
    }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 640px) {
      nav { padding: 0 16px; }
      nav .nav-links a { padding: 5px 8px; font-size: .82rem; }
      main { margin: 16px auto; padding: 0 12px; }
      section, .card { padding: 20px 16px; }
      h1 { font-size: 1.35rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" stroke="url(#ng)" stroke-width="1.8"/>
      <path d="M7 12c0-2.76 2.24-5 5-5s5 2.24 5 5-2.24 5-5 5" stroke="url(#ng)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="2.5" fill="url(#ng)"/>
      <defs>
        <linearGradient id="ng" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>
      </defs>
    </svg>
    AQI India
  </div>
  <nav class="nav-links">
    <a href="/" id="nav-home">Home</a>
    <a href="/forecast" id="nav-forecast">Forecast</a>
    <a href="/map" id="nav-map">Map</a>
    <a href="/covid" id="nav-covid">COVID-19</a>
    <a href="/models" id="nav-models">Models</a>
  </nav>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer>
  Data: CPCB India Air Quality (2015–2020) &nbsp;·&nbsp; Model outputs are estimates, not official forecasts or medical advice.
</footer>
<script src="{{ url_for('static', filename='advisory.js') }}"></script>
<script>
  // Highlight active nav link
  (function() {
    const path = window.location.pathname;
    const map = {'/' : 'nav-home', '/forecast': 'nav-forecast', '/map': 'nav-map',
                  '/covid': 'nav-covid', '/models': 'nav-models'};
    const id = map[path] || (path.startsWith('/models') ? 'nav-models' : null);
    if (id) { const el = document.getElementById(id); if (el) el.classList.add('active'); }
  })();

  function td(text) {
    const c = document.createElement('td');
    c.textContent = text;
    return c;
  }
  function fmtNum(v, d) {
    return (v === null || v === undefined) ? '–' : Number(v).toFixed(d === undefined ? 2 : d);
  }
  function showError(id, msg) {
    const e = document.getElementById(id);
    e.textContent = msg;
    e.style.display = 'block';
  }
  function hideError(id) {
    document.getElementById(id).style.display = 'none';
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
